function preview(){return `<div class="content start-content stack"><div><h2>${templates[selectedTemplate][0]}</h2><p class="note" style="margin-top:7px">${templates[selectedTemplate][1]} · 适合项目汇报、阶段总结</p></div><div class="card preview-deck"><div class="thumb" id="preview-slide">${templateSVG(selectedTemplate,previewPage)}</div></div><div class="preview-pages">${['封面','数据页','内容页'].map((s,i)=>`<button class="${previewPage===i?'active':''}" data-slide="${i}">${s}</button>`).join('')}</div><div class="row"><span class="capsule">可编辑元素</span><span class="capsule">16:9 宽屏</span><span class="capsule">版式示意</span></div><p class="note">选择后回到 PPT 制作页。页数、场景和语言仍可调整。</p><button class="primary wide" data-go="ppt">用这个模板${icon('check')}</button></div>`;}
function progress(){return `<div class="content start-content stack"><div class="profile-head">${agentIcon(agents[0])}<div><h2>正在整理你的汇报</h2><p>项目进展汇报 · 6–10 页</p></div></div><div class="card progress-card"><div class="progress-title"><span class="agent-icon">${icon('ppt')}</span><h3>排版与配图</h3><span class="small quiet" style="margin-left:auto">第 2 / 3 步</span></div><div class="progress-track"><span></span></div><div class="progress-step">${icon('check')}已读取资料，整理内容结构</div><div class="progress-step">${icon('clock')}正在安排页面版式与图片</div><div class="progress-step">${icon('file')}接下来检查排版，生成最终文件</div><div class="section-rule" style="margin:15px 0"></div><div class="row between"><span class="small muted">可以离开页面，稍后回来查看</span><button class="text-button" data-demo="停止制作">停止</button></div></div><button class="outline-button" data-go="complete">查看完成状态设计${icon('chevron')}</button><p class="note">当前是设计稿状态演示，没有调用模型或生成文件。</p></div>`;}
function complete(){return `<div class="content start-content stack"><div class="profile-head">${agentIcon(agents[0])}<div><h2>汇报已经整理好了</h2><p>8 页 · 政企汇报 · 科技蓝</p></div></div><p class="welcome">按“阶段成果 → 关键进展 → 下一步计划”展开，文字和图表都可以继续编辑。</p><div class="card final-file"><div class="final-label">${icon('check')}最终文件</div><div class="row"><span class="agent-icon blue">${icon('ppt')}</span><div><p class="file-name">项目进展汇报.pptx</p><p class="small muted">8 页 · 可编辑 PowerPoint</p></div></div><button class="primary wide" data-demo="打开最终文件">${icon('download')}打开 / 下载</button><details class="other-files"><summary>${icon('folder')}其他文件（2）${icon('down')}</summary><p>页面预览.pdf · 预览文件</p><p>项目进展汇报_过程稿.pptx · 过程稿</p></details></div><div><h2 style="margin-bottom:10px">还想调整哪里？</h2><div class="followups"><button data-revise="修改第 3 页">改一页</button><button data-go="templates">换风格</button><button data-revise="给每页加演讲备注">加演讲备注</button></div></div><p class="note">设计稿中的示例文件用于展示交付层级，不提供虚构下载。</p></div>`;}
const gongwenKinds=['通知','请示','批复','报告','函','纪要','简报','领导讲话','述职报告','工作总结','心得体会','更多文种'];
function gongwen(){return `<div class="content stack"><div class="profile-head">${agentIcon(agents[1])}<div><h2>先选文种，再理思路</h2><p>把事实和要点交给未央。</p></div></div><div class="tabs"><button class="tab active" data-kind-group="机关单位">机关单位</button><button class="tab" data-kind-group="职场办公">职场办公</button></div><div class="kinds" id="kind-list">${gongwenKinds.map(s=>`<button class="kind ${s===kind?'active':''}" ${s==='更多文种'?'data-kind-group="职场办公"':`data-kind="${s}"`}>${icon(s==='批复'?'check':'gongwen')}<span>${s}</span></button>`).join('')}</div><section><div class="section-head"><h2>已有文字，也能继续完善</h2></div><div class="tools-strip">${['校对润色','提纲','扩写','续写','改写','缩写'].map(s=>`<button data-revise="帮我${s}这段文字">${s}</button>`).join('')}</div></section><button class="upload card" data-upload>${icon('upload')}上传来文或参考资料<small>拍照、图片、Word、PDF</small></button></div>`;}
function gongwenForm(){return `<div class="content stack"><div class="section-head"><h2>${kind} · 填几项就能开始</h2><button class="text-button" data-go="gongwen">换文种</button></div><div class="card form-card stack"><button class="upload uploaded" data-upload>${icon('file')}<span>${kind==='述职报告'?'年度工作记录.docx':'关于项目实施方案的请示.docx'}<small style="display:block;color:var(--quiet)">已上传 · 示例状态 · 点击替换</small></span></button><div class="fields-grid"><div class="field"><label>${kind==='述职报告'?'汇报人':'发文单位'}</label><input placeholder="填写单位全称"></div><div class="field"><label>${kind==='述职报告'?'所属部门':'主送单位'}</label><input placeholder="填写接收单位"></div></div><div class="field"><label>${kind==='述职报告'?'主要工作、成果与不足':'批复要点'}</label><textarea rows="4" placeholder="例如：是否同意、执行要求、需要补充的事项…"></textarea></div><div class="fields-grid"><div class="field"><label>篇幅</label><select><option>500 字左右</option><option>1000 字左右</option></select></div><div class="field"><label>语气</label><select><option>正式</option><option>简洁</option></select></div></div><p class="note">${kind==='述职报告'?'根据工作记录整理履职情况、成果与下一步计划，缺失的业绩数据不会编造。':'先提炼来文要点，再起草批复。未提供的文号、日期等会留待补充。'}</p><button class="primary wide" data-revise="根据资料与要点起草${kind}">开始起草${icon('send')}</button></div></div>`;}
function imagePage(){const options=[['poster','海报设计'],['removebg','抠图去背景'],['portrait','证件照换底色'],['restore','老照片修复'],['ocr','图片转文字'],['caption','图片配说明']];return `<div class="content stack"><div class="image-tools">${options.map(([id,label],i)=>`<button class="card" data-image-tool="${label}"><span class="agent-icon ${['rose','blue','','gold','blue','green'][i]}">${icon(id)}</span>${label}</button>`).join('')}</div><section><div class="section-head"><h2 id="image-task">处理前后，一眼对比</h2><button class="text-button" data-upload>换一张图片</button></div><div class="compare"><div class="original">${icon('portrait')}</div><div class="edited" id="compare-edited">${icon('portrait')}</div><div class="compare-labels"><span>原图</span><span>处理后 · 示意</span></div><div class="compare-line" id="compare-line"><span>↔</span></div></div><input type="range" class="range" aria-label="处理前后对比" min="5" max="95" value="50"><div class="row"><button class="outline-button wide" data-demo="保存图片">${icon('download')}保存</button><button class="outline-button wide" data-demo="分享图片">${icon('share')}分享</button></div></section><button class="upload card" data-upload>${icon('upload')}上传一张图片<small>选好功能，再查看处理效果</small></button><p class="note">未配置图像服务时，正式页面会明确提示需要配置，不会显示处理成功。</p></div>`;}
function mine(){return `<div class="content stack"><div class="field"><label>图标</label><select aria-label="智能体图标"><option>文档</option><option>研究</option><option>图片</option><option>天气</option></select></div><div class="field"><label>智能体名字</label><input value="我的每日简报" maxlength="40"></div><div class="field"><label>开场白</label><textarea rows="2">把每天的重要消息整理成简报，帮你快速掌握重点。</textarea></div><div class="field"><label>推荐问题 · 3 条</label><textarea rows="3">整理今天的本地新闻
把这些要点做成简报
调整每天的简报内容</textarea></div><section><div class="section-head"><h2>它可以做什么</h2></div><div class="check-group">${['联网查询','生成文档','读取文件','生成图片','设置提醒'].map((s,i)=>`<label><input type="checkbox" ${i!==3?'checked':''}>${s}</label>`).join('')}</div></section><section><div class="section-head"><h2>按你的步骤办事</h2><span class="small quiet">可上下调整</span></div><div class="steps" id="steps">${renderSteps()}</div><button class="text-button" data-add-step>${icon('plus')}添加一步</button></section><div class="card form-card"><div class="row between"><span class="row">${icon('clock')}触发方式</span><select aria-label="触发方式"><option>手动运行</option><option selected>每天 08:00</option></select></div><p class="note" style="margin-top:9px">按北京时间执行，可随时暂停。</p></div><button class="primary wide" data-demo="保存智能体">保存智能体</button><div class="row"><button class="outline-button wide" data-demo="导入配置">${icon('upload')}导入</button><button class="outline-button wide" data-demo="导出配置">${icon('share')}导出</button></div><p class="note">只分享配置，不包含账号密钥、对话和附件。</p></div>`;}
function posterPage(){return `<div class="content stack"><div class="card form-card stack"><div class="fields-grid"><div class="field"><label>尺寸</label><select><option>竖版</option><option>横版</option><option>方形</option><option>朋友圈封面</option></select></div><div class="field"><label>用途</label><select><option>活动宣传</option><option>产品介绍</option></select></div></div><div class="field"><label>海报标题</label><input value="一起，向自然出发"></div><div class="field"><label>要点与风格</label><textarea rows="2">周末城市徒步，轻松、清新。突出集合时间与地点。</textarea></div><button class="primary wide" data-demo="生成海报候选">生成 4 张候选${icon('spark')}</button></div><section><div class="section-head"><h2>选一个喜欢的方向</h2><span class="small quiet">版式示意</span></div><div class="templates">${['清新自然','简洁留白','重点突出','柔和氛围'].map((s,i)=>`<button class="template" data-demo="查看海报候选"><div class="thumb" style="aspect-ratio:3/4"><svg viewBox="0 0 180 240"><rect width="180" height="240" fill="var(--${i%2?'surface-solid':'green-soft'})"/><circle cx="${[48,135,95,155][i]}" cy="${[150,150,190,115][i]}" r="66" fill="var(--${i%2?'accent-soft':'green'})" opacity=".35"/><path d="M0 210Q85 110 180 195V240H0Z" fill="var(--${i%2?'accent':'green'})" opacity=".5"/><text x="20" y="39" fill="var(--muted)" font-size="8" letter-spacing="2">WEEKEND WALK</text><text x="20" y="73" fill="var(--text)" font-size="18" font-weight="700">一起，向自然出发</text><text x="20" y="94" fill="var(--muted)" font-size="9">周末城市徒步计划</text><text x="20" y="220" fill="var(--text)" font-size="9">11.08 / 09:00 · 城市公园</text></svg></div><h3>${s}</h3></button>`).join('')}</div></section></div>`;}
function renderSteps(){return steps.map((s,i)=>`<div class="card step"><span class="step-num">${i+1}</span><div class="step-text"><strong class="small">${s}</strong><small>${['搜索资料','整理摘要','输出文件','设置提醒'][Math.min(i,3)]}</small></div><button class="icon-button" data-step-up="${i}" aria-label="上移第${i+1}步" ${i===0?'disabled':''}>${icon('up')}</button><button class="icon-button" data-step-delete="${i}" aria-label="删除第${i+1}步">${icon('trash')}</button></div>`).join('');}
function chat(){if(chatAgent.id!=='ppt')return `<div class="content chat-content"><div class="user-message">${esc(sentText)}</div><div class="answer"><div class="answer-name">${agentIcon(chatAgent)}<strong>${chatAgent.name}</strong></div><p>${chatAgent.id==='health'?'可以，把报告发给我，我会先解释关键指标，再帮你整理需要进一步确认的问题。上传前可以遮住姓名、身份证号等个人信息。':'可以，把具体要求或资料发给我，我们从最重要的一件事开始。'}</p><button class="outline-button" style="margin-top:20px" data-upload>${icon('upload')}添加资料</button><p class="note" style="margin-top:16px">这是设计稿中的示例对话，没有实际调用模型。</p></div></div>${composer()}`;return `<div class="content chat-content"><div class="user-message">${esc(sentText)}</div><div class="answer"><div class="answer-name">${agentIcon(agents[0])}<strong>PPT 制作</strong><span>09:41</span></div><p>可以。我会保留资料里的事实和数字，按这条主线整理：</p><h3>先讲成果，再讲下一步</h3><ul><li>项目目标与当前进展</li><li>阶段成果、关键数据</li><li>待解决的问题与行动计划</li></ul><p>版式采用科技蓝，数据页用图表呈现。整理完成后，我会核对页数和排版。</p><div class="card context-card" style="margin-top:18px">${icon('ppt')}<div><strong class="small">项目进展汇报</strong><p class="small muted">8 页 · 政企汇报 · 科技蓝</p></div><button class="icon-button" data-go="complete" aria-label="查看交付设计">${icon('chevron')}</button></div><div class="answer-tools"><button class="icon-button" data-demo="复制回答" aria-label="复制">${icon('copy')}</button><button class="icon-button" data-demo="朗读回答" aria-label="朗读">${icon('sound')}</button></div></div></div>${composer()}`;}
function drawer(){return `${square()}<div class="drawer-demo"><aside class="drawer"><div class="brand"><img src="${logo}" alt="未央小精灵"><div><strong>未央</strong><small>陪你想，也陪你做</small></div><button class="icon-button" data-go="square" aria-label="关闭抽屉" style="margin-left:auto">${icon('close')}</button></div><button class="new-chat" data-new-chat>${icon('plus')}开启新对话</button><div class="card discover-card"><button class="discover-heading" style="width:100%;text-align:left" data-go="square"><span>发现智能体</span>${icon('chevron')}</button><div class="recent-agents">${[agents[0],agents[1],agents[5]].map(a=>`<button data-agent="${a.id}">${agentIcon(a)}<span>${a.name}</span></button>`).join('')}</div></div><div class="quick-entries"><button data-demo="工作区">${icon('folder')}工作区</button><button data-demo="知识库">${icon('research')}知识库</button><button data-demo="更多工具">${icon('grid')}更多工具</button></div><section><p class="history-label">最近一周</p>${[[agents[0],'项目进展汇报','09:12'],[agents[5],'帮我读懂体检报告','昨天'],[agents[6],'周末出行计划','周二'],[null,'最近有什么好看的书','周一']].map(([a,t,time])=>`<button class="history-row" data-go="chat">${a?agentIcon(a):`<img src="${logo}" alt="">`}<span>${t}</span><time>${time}</time></button>`).join('')}<p class="history-label" style="margin-top:16px">更早</p><button class="history-row" data-go="chat">${agentIcon(agents[1])}<span>部门工作总结</span><time>10/28</time></button></section><div class="drawer-footer"><span class="avatar">我</span><div><strong class="small">我的未央</strong><p class="small muted">记录与陪伴</p></div><button class="icon-button" data-demo="设置" aria-label="设置">${icon('settings')}</button></div></aside></div>`;}
function navigate(next){page=next;render();window.scrollTo(0,0);}
function render(){document.querySelector('#sidebar').innerHTML=sidebar();const title=page==='start'?currentAgent.name:page==='chat'?chatAgent.name:({drawer:'发现智能体',square:'发现智能体',ppt:'PPT 制作',templates:'PPT 模板库',preview:'模板预览',progress:'PPT 制作',complete:'PPT 制作',gongwen:'公文写作','gongwen-form':'公文写作',image:'图片处理','image-poster':'海报设计',mine:'创建智能体'})[page]||'发现智能体';document.querySelector('#topbar').innerHTML=`<button class="icon-button" ${page==='square'?'data-go="drawer"':'data-back'} aria-label="${page==='square'?'打开菜单':'返回'}">${icon(page==='square'?'menu':'back')}</button><h1>${title}</h1><button class="icon-button" data-theme-toggle aria-label="切换主题">${icon('sun')}</button>`;document.querySelector('#view').innerHTML=({square,drawer,start,chat,ppt,templates:allTemplates,preview,progress,complete,gongwen,'gongwen-form':gongwenForm,image:imagePage,'image-poster':posterPage,mine}[page]||square)();document.querySelector('#page-select').value=page;document.body.dataset.page=page;}
function showToast(text){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),2600);}
function fillComposer(text){const input=document.querySelector('#composer-input');if(input){input.value=text;input.focus();}}
document.querySelector('#page-select').innerHTML=pages.map(([id,label])=>`<option value="${id}">${label}</option>`).join('');document.querySelector('#page-select').onchange=e=>navigate(e.target.value);
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.hasAttribute('data-new-chat')){currentAgent={id:'chat',name:'未央',tone:'',intro:'你想做什么，都可以和我说。',starters:['帮我梳理今天的工作','看看今天有什么新闻','陪我聊一会儿']};return navigate('start');}if(b.hasAttribute('data-go'))return navigate(b.dataset.go);if(b.hasAttribute('data-back'))return navigate(({preview:'templates',templates:'ppt','gongwen-form':'gongwen',progress:'ppt',complete:'ppt',chat:'start'})[page]||'square');if(b.hasAttribute('data-theme-toggle')){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return;}if(b.dataset.agent){currentAgent=agents.find(a=>a.id===b.dataset.agent);return navigate(({ppt:'ppt',gongwen:'gongwen',poster:'image',ocr:'image'})[currentAgent.id]||'start');}if(b.dataset.category){category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x.dataset.category===category));document.querySelector('#agent-list').innerHTML=agentCards();return;}if(b.hasAttribute('data-clear-search')){search='';render();return;}if(b.hasAttribute('data-template')){selectedTemplate=Number(b.dataset.template);previewPage=0;return navigate('preview');}if(b.hasAttribute('data-slide')){previewPage=Number(b.dataset.slide);render();return;}if(b.hasAttribute('data-template-filter')){document.querySelectorAll('[data-template-filter]').forEach(x=>x.classList.toggle('active',x===b));const indexes=templates.map((t,i)=>[t,i]).filter(([t])=>b.dataset.templateFilter==='all'||t[2]===b.dataset.templateFilter).map(([,i])=>i);document.querySelector('#template-list').innerHTML=indexes.map(renderTemplate).join('');return;}if(b.dataset.starter)return fillComposer(b.dataset.starter);if(b.dataset.revise){currentAgent=page.startsWith('gongwen')?agents[1]:agents[0];navigate('start');return fillComposer(b.dataset.revise);}if(b.hasAttribute('data-send')){sentText=document.querySelector('#composer-input')?.value.trim();if(!sentText)return;chatAgent=currentAgent;return navigate('chat');}if(b.hasAttribute('data-upload')){document.querySelector('#upload-input').click();return;}if(b.dataset.kind){kind=b.dataset.kind;return navigate('gongwen-form');}if(b.dataset.kindGroup){document.querySelectorAll('[data-kind-group]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#kind-list').innerHTML=(b.dataset.kindGroup==='机关单位'?gongwenKinds:['方案','周报','邮件','致辞']).map(s=>`<button class="kind" data-kind="${s}">${icon('gongwen')}<span>${s}</span></button>`).join('');return;}if(b.dataset.imageTool){if(b.dataset.imageTool==='海报设计')return navigate('image-poster');document.querySelector('#image-task').textContent=b.dataset.imageTool;return;}if(b.hasAttribute('data-step-up')){const i=Number(b.dataset.stepUp);if(i>0)[steps[i-1],steps[i]]=[steps[i],steps[i-1]];document.querySelector('#steps').innerHTML=renderSteps();return;}if(b.hasAttribute('data-step-delete')){steps.splice(Number(b.dataset.stepDelete),1);document.querySelector('#steps').innerHTML=renderSteps();return;}if(b.hasAttribute('data-add-step')){if(steps.length>=5)return showToast('设计稿最多演示 5 步');steps.push('设置完成提醒');document.querySelector('#steps').innerHTML=renderSteps();return;}if(b.hasAttribute('data-link')){const d=document.querySelector('#dialog');d.innerHTML='<h2>从链接开始</h2><p>未央会先读取网页，再整理成 PPT。</p><input type="url" placeholder="https://…" aria-label="资料链接"><div class="row"><button class="outline-button wide" data-close-dialog>取消</button><button class="primary wide" data-demo="读取链接" data-close-dialog>使用链接</button></div>';d.showModal();return;}if(b.hasAttribute('data-close-dialog'))document.querySelector('#dialog').close();if(b.dataset.demo)showToast(b.dataset.demo+'：这是设计预览，正式功能接入后使用。');});
document.addEventListener('input',event=>{if(event.target.matches('[data-search]')){search=event.target.value;document.querySelector('#agent-list').innerHTML=agentCards();}if(event.target.matches('.topic'))document.querySelector('#topic-count').textContent=event.target.value.length+' / 1000';if(event.target.matches('.range')){document.querySelector('#compare-edited').style.clipPath=`inset(0 0 0 ${event.target.value}%)`;document.querySelector('#compare-line').style.left=event.target.value+'%';}});
document.querySelector('#upload-input').onchange=e=>{if(e.target.files[0])showToast('已选择 '+e.target.files[0].name+'；设计稿不上传文件。');};
document.addEventListener('change',e=>{if(e.target.id==='template-color'){document.querySelector('#template-list').innerHTML=templates.map((t,i)=>[t,i]).filter(([t])=>e.target.value==='all'||t[3]===e.target.value).map(([,i])=>renderTemplate(i)).join('');}});
render();window.design={navigate,pages,paths,icon,templates};
</script></body></html>
