name: 模型工作台候选验证
on:
  push:
    branches: ['codex/model-workspace-20261020']
    paths: ['.github/workflows/model-workspace-check.yml']
permissions:
  contents: write
jobs:
  verify:
    name: 最终模型工作台专项复验
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - name: 安装依赖和浏览器
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 格式化并保存候选源码
        run: |
          npm run format
          git config user.name "weiyang-ci"
          git config user.email "weiyang-ci@users.noreply.github.com"
          npx prettier --ignore-path /dev/null --write src/llm/modelLibrary.js src/llm/modelCatalog.js src/llm/modelScopes.js src/ui/modelLibrary.js src/ui/libraryPicker.js src/ui/modelLibrary.css server/modelCatalog.mjs tests/modelLibrary.test.js e2e/model-library.mjs
          git add src/main.js src/app src/llm/modelLibrary.js src/llm/modelCatalog.js src/llm/modelScopes.js src/ui/modelLibrary.js src/ui/libraryPicker.js src/ui/modelLibrary.css server/modelCatalog.mjs tests/modelLibrary.test.js e2e/model-library.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format model workspace [skip ci]"
            git push origin HEAD:codex/model-workspace-20261020
          fi
      - name: 完整单测与代码检查
        run: |
          npm run lint
          npx vitest run
      - name: 构建并验证实际模型工作台
        run: |
          npm run build
          npm run build:mobile
          mkdir -p "$RUNNER_TEMP/jarvis-e2e"
          node e2e/model-library.mjs "$RUNNER_TEMP/jarvis-e2e"
      - name: 保存实际界面用于视觉自查
        if: always()
        run: |
          mkdir -p ../.model-preview
          cp "$RUNNER_TEMP"/jarvis-e2e/model-settings-*.png ../.model-preview/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/jarvis-e2e/model-picker-*.png ../.model-preview/ 2>/dev/null || true
          python3 -c "import pathlib,base64; files=pathlib.Path('../.model-preview').glob('*.png'); [(p.with_suffix('.png.b64').write_text(base64.b64encode(p.read_bytes()).decode())) for p in files]"
          git add ../.model-preview
          if ! git diff --cached --quiet; then
            git commit -m "test: final model workspace visual previews [skip ci]"
            git push origin HEAD:codex/model-workspace-20261020
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-workspace-final-preview
          path: ${{ runner.temp }}/jarvis-e2e

