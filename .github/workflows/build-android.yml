# 让 GitHub 的机器打安卓包。本机不用装 Android SDK。
#
# 出的是 **debug 包**：它用 Android 自带的调试签名，下下来直接就能装。
# release 包要自己的 keystore，而把私钥放进仓库是绝对不行的 ——
# 要上应用商店时再自己签。
#
# 和 Windows 那条流水线一样，产物发到同一个 Releases 页面：
# 推代码更新 snapshot 预发布，打 v 开头的 tag 发正式版。
name: 构建安卓遥控端

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      # 安卓壳很少改，网页那边改一行不必重打一次包（打一次三四分钟）
      - 'desktop/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 仓库里不放 gradle-wrapper.jar —— 那是个二进制，来源说不清的二进制不该进仓库。
      # runner 自带 gradle，直接用它生成一次 wrapper 再构建。
      - name: 准备 Gradle
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: 打 debug 包
        run: ./gradlew assembleDebug --no-daemon

      - name: 看看产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 发布到 Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "FutureDream-Remote.apk"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="snapshot"
          fi

          # Release 由 Windows 那条流水线创建；这里只往上挂附件。
          # 万一安卓这条先跑完，就自己建一个占位的预发布。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "未来创梦 开发快照" --notes "构建中…" --prerelease
          fi

          for attempt in 1 2 3; do
            if gh release upload "$TAG" "FutureDream-Remote.apk" --clobber; then
              echo "✓ 已上传"
              exit 0
            fi
            echo "! 第 $attempt 次没传上去，删掉残留的同名附件再试"
            gh release delete-asset "$TAG" "FutureDream-Remote.apk" --yes >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          echo "✗ 三次都没传上去"
          exit 1
