name: Lookup recovery checks
on:
  push:
    branches: ['codex/lookup-recovery-20261020']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npx prettier --write --ignore-path /dev/null src/agent/lookupWindow.js src/agent/retrievalQuality.js src/agent/reviewOutcome.js evals/direct-model.mjs tests/lookupRecovery.test.js
      - run: node evals/direct-model.mjs
      - run: npm run lint
      - run: npm run eval:check
      - run: npx vitest run
      - name: 保存格式结果
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/app src/agent/lookupWindow.js src/agent/retrievalQuality.js src/agent/reviewOutcome.js evals/direct-model.mjs tests/lookupRecovery.test.js
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] 统一检索收尾模块及测速测试格式'
            git push origin HEAD:$GITHUB_REF_NAME
          fi
