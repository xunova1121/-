name: Build Windows EXE

on:
  push:
    branches: ["codex/ai-film-studio-v0.2"]
  pull_request:
    branches: ["claude/windows-app-third-party-api-8h0qec"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local service
        shell: pwsh
        run: |
          python -m pip install -r codex-studio/server/requirements.txt
          $env:PYTHONPATH = "codex-studio/server"
          pytest -q codex-studio/server/tests
      - name: Build local service EXE
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          Push-Location codex-studio/server
          pyinstaller AIStudioService.spec --clean --noconfirm
          Pop-Location
      - name: Smoke test packaged local service
        shell: pwsh
        run: |
          $service = Start-Process -FilePath "codex-studio/server/dist/AIStudioService.exe" -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18118/api/v1/health" -TimeoutSec 2
                if ($response.status -eq "ok") { $healthy = $true; break }
              } catch { }
              if ($service.HasExited) { throw "Packaged service exited early with code $($service.ExitCode)" }
            }
            if (-not $healthy) {
              $logRoot = Join-Path $env:LOCALAPPDATA "AI-Film-Studio/logs"
              Get-ChildItem $logRoot -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
              throw "Packaged service did not become healthy"
            }
            $headers = @{ "Content-Type" = "application/json" }
            $project = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18118/api/v1/projects" -Headers $headers -Body (@{ name="预演冒烟"; genre="测试"; episode_count=1 } | ConvertTo-Json)
            $layout = @{ scene_key="ci-stage"; camera=@{ position=@{x=0;y=-5}; target=@{x=0;y=0}; lens_mm=35; height_m=1.6; movement="fixed" }; subjects=@(@{entity_key="主角";position=@{x=0;y=0};facing_deg=180;pose="standing"}); landmarks=@(); sun_bearing_deg=-45; sun_elevation="mid" }
            $first = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18118/api/v1/projects/$($project.id)/previz/layouts" -Headers $headers -Body ($layout | ConvertTo-Json -Depth 8)
            $layout.camera.position.y = 5
            $second = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18118/api/v1/projects/$($project.id)/previz/layouts" -Headers $headers -Body ($layout | ConvertTo-Json -Depth 8)
            $versions = Invoke-RestMethod -Uri "http://127.0.0.1:18118/api/v1/projects/$($project.id)/previz/layouts?scene_key=ci-stage"
            if ($first.version -ne 1 -or $second.version -ne 2 -or $versions.Count -ne 2) { throw "Packaged previz version round-trip failed" }
            if (-not ($second.analysis.findings | Where-Object { $_.type -eq "axis" })) { throw "Packaged previz axis analysis failed" }
          } finally {
            if (-not $service.HasExited) { Stop-Process -Id $service.Id -Force }
            Get-Process AIStudioService -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 750
          }
      - name: Build WPF client EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force codex-studio/client/AI.FilmStudio/Embedded
          Copy-Item codex-studio/server/dist/AIStudioService.exe codex-studio/client/AI.FilmStudio/Embedded/AIStudioService.exe
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg package is incomplete" }
          Copy-Item $ffmpeg.FullName codex-studio/client/AI.FilmStudio/Embedded/ffmpeg.exe
          Copy-Item $ffprobe.FullName codex-studio/client/AI.FilmStudio/Embedded/ffprobe.exe
          dotnet publish codex-studio/client/AI.FilmStudio/AI.FilmStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist/AI-Film-Studio
      - name: Smoke test packaged desktop app
        shell: pwsh
        run: |
          $ready = Join-Path $env:LOCALAPPDATA "AI-Film-Studio/desktop-ready.txt"
          Remove-Item $ready -Force -ErrorAction SilentlyContinue
          $desktop = Start-Process -FilePath "dist/AI-Film-Studio/AI-Film-Studio.exe" -PassThru
          try {
            $started = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($desktop.HasExited) { break }
              if (Test-Path $ready) {
                $markerPid = ((Get-Content $ready -Raw) -split '\|')[0]
                if ($markerPid -eq "$($desktop.Id)") { $started = $true; break }
              }
            }
            if (-not $started) {
              $log = Join-Path $env:LOCALAPPDATA "AI-Film-Studio/logs/desktop.log"
              if (Test-Path $log) { Get-Content $log }
              throw "Desktop main window did not publish a valid ready marker"
            }
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:18118/api/v1/health" -TimeoutSec 3
            if ($response.status -ne "ok") { throw "Desktop-launched service is unhealthy" }
            if ($response.version -ne "0.7.0") { throw "Unexpected service version: $($response.version)" }
            $media = Invoke-RestMethod -Uri "http://127.0.0.1:18118/api/v1/media/capabilities" -TimeoutSec 3
            if (-not $media.ffmpeg_available) {
              $runtime = Join-Path $env:LOCALAPPDATA "AI-Film-Studio/runtime"
              Get-ChildItem $runtime -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table
              throw "Embedded FFmpeg was not detected"
            }
          } finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
            Get-Process AIStudioService -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Verify single-file delivery
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/AI-Film-Studio -File
          if ($files.Count -ne 1 -or $files[0].Name -ne "AI-Film-Studio.exe") { throw "Delivery must contain exactly one EXE" }
          Get-FileHash dist/AI-Film-Studio/AI-Film-Studio.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Film-Studio-V0.7.0-Interactive-Previz-Single-EXE
          path: dist/AI-Film-Studio/AI-Film-Studio.exe
          retention-days: 30
