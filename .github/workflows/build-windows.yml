name: Build Real AI Film Studio
# Primary Windows delivery: verified Electron app + bundled FFmpeg + portable EXE.

on:
  push:
    branches: ["codex/ai-film-studio-v0.2"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop build dependencies
        shell: pwsh
        run: npm install

      - name: Offline product self-test
        shell: pwsh
        env:
          FUTUREDREAM_DISABLE_PATH_FFMPEG: "1"
        run: npm run selftest

      - name: Install and stage bundled FFmpeg
        shell: pwsh
        run: |
          npm install --no-save ffmpeg-static@5.2.0
          node scripts/stage-ffmpeg.mjs

      - name: Real FFmpeg media test
        shell: pwsh
        env:
          REALCHECK_REQUIRED: "1"
          FUTUREDREAM_BIN_DIR: ${{ github.workspace }}\desktop\bin
          FFMPEG_PATH: ${{ github.workspace }}\desktop\bin\ffmpeg.exe
          FUTUREDREAM_DISABLE_PATH_FFMPEG: "1"
        run: npm run realcheck

      - name: Electron development smoke test
        shell: pwsh
        run: npm run smoke

      - name: Stamp build identity
        shell: pwsh
        run: |
          $build = "${{ github.sha }}".Substring(0, 12)
          @{ build = $build } | ConvertTo-Json | Set-Content core/build.json -Encoding utf8

      - name: Build installer and one-file portable EXE
        shell: pwsh
        run: npm run build:win

      - name: Verify packaged runtime and launch packaged app
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $PWD "dist\win-unpacked\resources\bin\ffmpeg.exe"
          if (-not (Test-Path $ffmpeg)) { throw "Packaged app is missing resources/bin/ffmpeg.exe" }
          & $ffmpeg -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "Packaged FFmpeg cannot run" }

          $app = Get-ChildItem "dist\win-unpacked" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $app) { throw "Cannot find packaged desktop executable" }
          $process = Start-Process -FilePath $app.FullName -ArgumentList "--smoke" -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged desktop smoke test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged desktop smoke test failed with code $($process.ExitCode)" }

      - name: Prepare verified download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = Get-ChildItem dist -Filter "AI-Film-Studio-Portable-*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable EXE was not produced" }
          $target = "release\AI-Film-Studio-Real-V0.2.0-Windows-x64.exe"
          Copy-Item $portable.FullName $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI-Film-Studio-Real-V0.2.0-Windows-x64.exe" | Set-Content "release\SHA256SUMS.txt" -Encoding ascii
          Get-Item $target | Format-List Name,Length,LastWriteTime
          Get-Content "release\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Film-Studio-Real-V0.2.0-Windows-x64
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified Codex prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ai-film-studio-v0.2.0-codex"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "AI影视Studio V0.2.0 Codex 验证版" --notes "真实 Electron 全流程产品；内置 FFmpeg；Windows portable EXE 已通过离线产品、真实媒体、开发态与打包态启动测试。"
          }
          gh release upload $tag "release\AI-Film-Studio-Real-V0.2.0-Windows-x64.exe" "release\SHA256SUMS.txt" --repo "${{ github.repository }}" --clobber
