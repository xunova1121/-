# 让 GitHub 的 Windows 机器替你打包「未来创梦」，本机不用装任何工具链。
#
# 触发方式三选一：
#   1. 推代码到任意分支 —— 更新 snapshot 预发布，永远指向最新一次构建
#   2. Actions 页面手动点「Run workflow」
#   3. 打 v 开头的 tag（如 v0.1.0）—— 发一个正式 Release
#
# 产物发到 Releases 页面，不走 Actions Artifacts ——
# Artifacts 有独立的存储配额，满了就传不上去（这个仓库已经踩过一次），
# 而 Release 附件不占那份配额，链接也更稳定、更好分享。
name: 构建 Windows 安装包

on:
  push:
    branches: ['**']
    tags: ['v*']
    # 刻意不加 paths 过滤：GitHub 的路径过滤对 tag 推送同样生效，
    # 加了会出现"打了 tag 却不发版"这种很难查的情况。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 先跑自检再打包：源码本身有问题的话，没必要浪费几分钟去打一个坏包。
      # 这也是唯一一次在真实 Windows 上验证路径规则、DPAPI 降级、端口顺延这些逻辑。
      - name: 自检（111 项，不联外网）
        run: node scripts/selftest.mjs

      # 应用本身零运行时依赖，这一步装的只有 electron 和 electron-builder。
      # 没有 lockfile，所以用 install 而不是 ci。
      - name: 安装打包工具
        run: npm install

      # 真的把 Electron 主进程拉起来探一次 /api/health。
      # 加这一步是因为吃过亏：主进程里一个 Windows 专属的 ESM 加载错误
      # 躲过了全部单元自检，直到用户双击 exe 才炸出来 ——
      # "主进程能不能起来"这件事，只有真跑一次才测得到。
      - name: Electron 冒烟自检
        run: npm run smoke

      - name: 打包（安装版 + 免安装版）
        run: npm run build:win
        env:
          # 未签名的包，跳过 electron-builder 的公证/签名流程
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出产物
        run: dir dist
        shell: cmd

      # ── 发布 ──
      # 用 runner 自带的 gh CLI，不引第三方 action。
      # tag 推送发正式版；日常推送更新同一个 snapshot 预发布，
      # 这样下载链接永远是那一个，不会每次构建多出一条。
      - name: 发布到 Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="未来创梦 ${TAG}"
            PRERELEASE=""
          else
            TAG="snapshot"
            TITLE="未来创梦 开发快照"
            PRERELEASE="--prerelease"
          fi

          cat > notes.md <<NOTES
          构建自 \`${GITHUB_REF_NAME}\` 分支，提交 \`${GITHUB_SHA:0:7}\`。

          ## 下载哪个

          | 文件 | 说明 |
          |---|---|
          | \`FutureDream-Setup-*.exe\` | 安装版，可选安装目录，自动建桌面快捷方式 |
          | \`FutureDream-Portable-*.exe\` | 免安装版，双击即用，可放 U 盘带走 |

          两个都是 64 位，二选一即可，不用都下。

          ## 首次打开

          Windows SmartScreen 会拦一下（这个包没做代码签名）——
          点「更多信息 → 仍要运行」。

          打开后先去左侧「服务商与密钥」配一把 API Key 才能用；
          最省事的是只配火山引擎方舟一家，剧本／出图／视频／一致性复核都走它。
          详细步骤见 [desktop/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/desktop/README.md)。
          NOTES

          # snapshot 是滚动的：已存在就换掉旧附件，不存在才新建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA"
            gh release upload "$TAG" dist/*.exe --clobber
          else
            gh release create "$TAG" dist/*.exe \
              --title "$TITLE" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              $PRERELEASE
          fi

          echo "下载地址：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
