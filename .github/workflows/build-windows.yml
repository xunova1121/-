name: Build Windows EXE

on:
  push:
    branches: ["codex/ai-film-studio-v0.2"]
  pull_request:
    branches: ["claude/windows-app-third-party-api-8h0qec"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local service
        shell: pwsh
        run: |
          python -m pip install -r codex-studio/server/requirements.txt
          $env:PYTHONPATH = "codex-studio/server"
          pytest -q codex-studio/server/tests
      - name: Build local service EXE
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          Push-Location codex-studio/server
          pyinstaller AIStudioService.spec --clean --noconfirm
          Pop-Location
      - name: Smoke test packaged local service
        shell: pwsh
        run: |
          $service = Start-Process -FilePath "codex-studio/server/dist/AIStudioService.exe" -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18118/api/v1/health" -TimeoutSec 2
                if ($response.status -eq "ok") { $healthy = $true; break }
              } catch { }
              if ($service.HasExited) { throw "Packaged service exited early with code $($service.ExitCode)" }
            }
            if (-not $healthy) {
              $logRoot = Join-Path $env:LOCALAPPDATA "AI-Film-Studio/logs"
              Get-ChildItem $logRoot -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
              throw "Packaged service did not become healthy"
            }
          } finally {
            if (-not $service.HasExited) { Stop-Process -Id $service.Id -Force }
          }
      - name: Build WPF client EXE
        shell: pwsh
        run: |
          dotnet publish codex-studio/client/AI.FilmStudio/AI.FilmStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/AI-Film-Studio
          New-Item -ItemType Directory -Force dist/AI-Film-Studio/service
          Copy-Item codex-studio/server/dist/AIStudioService.exe dist/AI-Film-Studio/service/AIStudioService.exe
          Copy-Item codex-studio/README.md dist/AI-Film-Studio/README.md
      - name: Smoke test packaged desktop app
        shell: pwsh
        run: |
          $desktop = Start-Process -FilePath "dist/AI-Film-Studio/AI-Film-Studio.exe" -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($desktop.HasExited) {
              $log = Join-Path $env:LOCALAPPDATA "AI-Film-Studio/logs/desktop.log"
              if (Test-Path $log) { Get-Content $log }
              throw "Desktop app exited during startup with code $($desktop.ExitCode)"
            }
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:18118/api/v1/health" -TimeoutSec 3
            if ($response.status -ne "ok") { throw "Desktop-launched service is unhealthy" }
          } finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
            Get-Process AIStudioService -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/AI-Film-Studio/* -DestinationPath dist/AI-Film-Studio-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Film-Studio-Windows-x64
          path: dist/AI-Film-Studio-Windows-x64.zip
          retention-days: 30
