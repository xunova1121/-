name: Export desktop source

on:
  push:
    branches: ["codex/ai-film-studio-v0.2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive desktop source
        run: zip -qr desktop-source.zip desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-source
          path: desktop-source.zip
          retention-days: 7
