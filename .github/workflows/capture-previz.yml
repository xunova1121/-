name: 截取真实3D预演台

on:
  workflow_dispatch:
  push:
    branches:
      - codex/claude-windows-app-upgrade
    paths:
      - .github/workflows/capture-previz.yml
      - desktop/scripts/capture-previz.mjs
      - desktop/scripts/capture-previz-cdp.mjs
      - desktop/core/server.js
      - desktop/ui/previz-demo.html
      - desktop/ui/previz-canvas.js
      - desktop/ui/previz-3d.js
      - desktop/ui/demo-assets/**

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Electron 与 Three.js
        run: npm install
      - name: 启动真实应用服务
        shell: pwsh
        run: |
          $process = Start-Process node -ArgumentList 'core/server.js' -WorkingDirectory $PWD -PassThru
          "FD_SERVER_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:5178/api/health' -UseBasicParsing
              if ($response.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          throw '应用服务30秒内未启动'
      - name: Windows Edge 实机渲染 Three.js 并截图
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { throw "找不到 Windows Edge：$edge" }
          New-Item -ItemType Directory -Force 'dist' | Out-Null
          $profile = (Resolve-Path 'dist').Path + '\edge-profile'
          $arguments = @(
            '--headless=new', '--enable-webgl', '--ignore-gpu-blocklist',
            '--use-angle=swiftshader', '--remote-debugging-port=9222', "--user-data-dir=$profile",
            '--window-size=1600,1100', 'about:blank'
          )
          $process = Start-Process -FilePath $edge -ArgumentList $arguments -PassThru -NoNewWindow
          try {
            node scripts/capture-previz-cdp.mjs
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path 'dist/FutureDream-Previz-Stage4.png')) {
            throw 'Windows Edge 未生成预演台截图'
          }
      - name: 核验截图
        shell: pwsh
        run: |
          $file = Get-Item 'dist/FutureDream-Previz-Stage4.png'
          if ($file.Length -lt 50000) { throw "截图异常小：$($file.Length) bytes" }
          Write-Host "截图大小：$([math]::Round($file.Length / 1KB, 1)) KB"
      - name: 上传真实预演台成果图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FutureDream-Previz-Stage4
          path: desktop/dist/FutureDream-Previz-Stage4.png
          if-no-files-found: error
          retention-days: 30
