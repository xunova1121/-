# 手动清理失败发版留下的草稿发布（用户 2026-11-05 要求删除 1.0.407 / 396 / 392 / 389 四个草稿）。
# 只删“草稿”且标签在输入清单里的发布；正式发布、预发布一律不动。只能手动触发。
name: 清理草稿发布

on:
  workflow_dispatch:
    inputs:
      tags:
        description: '要删除的草稿标签，逗号分隔'
        required: true
        default: 'desktop-v1.0.407,desktop-v1.0.396,desktop-v1.0.392,desktop-v1.0.389'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除指定的草稿发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate > releases.json
          IFS=',' read -ra wanted <<< "$TAGS"
          for tag in "${wanted[@]}"; do
            tag="$(echo "$tag" | xargs)"
            id="$(jq -r --arg t "$tag" '.[] | select(.tag_name == $t and .draft == true) | .id' releases.json | head -1)"
            if [ -z "$id" ]; then echo "跳过 $tag：不是草稿或不存在"; continue; fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            echo "已删除草稿 $tag（$id）"
          done
