# 测试文件单独改动时也运行完整单测，不重复打包安装包。
name: 未央单元回归
on:
  push:
    branches: ['**']
    paths:
      - 'jarvis/tests/**'
      - '.github/workflows/jarvis-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
