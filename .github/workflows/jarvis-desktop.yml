# 贾维斯桌面版：在 Windows / macOS / Linux 上分别打包安装包，另打包安卓 App（APK），一起发布到 Releases 页面。
# 触发：推送了 jarvis/ 下的改动、推送 desktop-v* 标签，或在 Actions 页面手动运行。
name: 贾维斯桌面版安装包

on:
  push:
    branches: ['**']
    # 打正式版：推送 desktop-v* 标签（GitHub 不对标签推送检查 paths）
    tags: ['desktop-v*']
    paths:
      - 'jarvis/src/**'
      - 'jarvis/server/**'
      - 'jarvis/shared/**'
      - 'jarvis/desktop/**'
      - 'jarvis/android/**'
      - 'jarvis/capacitor.config.json'
      - 'jarvis/vite.config.js'
      - 'jarvis/index.html'
      - 'jarvis/package*.json'
      - '.github/workflows/jarvis-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 打包 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            jarvis/package-lock.json
            jarvis/desktop/package-lock.json
      - name: 安装网页依赖
        run: npm ci --no-audit --no-fund
      - name: 单元测试
        if: runner.os == 'Linux'
        run: npm test
      - name: 安装桌面版依赖
        working-directory: jarvis/desktop
        run: npm ci --no-audit --no-fund
      - name: 版本号
        shell: bash
        # 正式标签 desktop-v1.2.3 → 1.2.3；平时每次构建 1.0.<序号>（自动更新靠版本号判断新旧）
        working-directory: jarvis/desktop
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then VERSION="${GITHUB_REF_NAME#desktop-v}"; else VERSION="1.0.${GITHUB_RUN_NUMBER}"; fi
          npm pkg set version="$VERSION"
          echo "打包版本 $VERSION"
      - name: 打包
        working-directory: jarvis/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            jarvis/desktop/release/*.exe
            jarvis/desktop/release/*.zip
            jarvis/desktop/release/*.dmg
            jarvis/desktop/release/*.AppImage
            jarvis/desktop/release/latest*.yml
            jarvis/desktop/release/*.blockmap

  android:
    name: 打包安卓 App
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: jarvis/android/**/*.gradle*
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 构建手机版网页并同步到安卓工程
        run: npm run android
      - name: 签名密钥
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # 有 GitHub Secrets 里的固定密钥就用它（新版本能直接覆盖安装）；
        # 没有时临时生成一个（能安装，但升级前要先卸载旧版）
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.keystore"
            echo "JARVIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "使用固定签名密钥"
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/jarvis.keystore" -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Jarvis" -noprompt
            echo "JARVIS_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "::warning::没有设置 ANDROID_KEYSTORE_B64，这次用临时密钥签名：手机上升级前需要先卸载旧版"
          fi
          echo "JARVIS_KEYSTORE=$RUNNER_TEMP/jarvis.keystore" >> "$GITHUB_ENV"
      - name: 打包 APK
        working-directory: jarvis/android
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then VERSION="${GITHUB_REF_NAME#desktop-v}"; else VERSION="1.0.${GITHUB_RUN_NUMBER}"; fi
          export JARVIS_VERSION_NAME="$VERSION" JARVIS_VERSION_CODE="$GITHUB_RUN_NUMBER"
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../release-android
          cp app/build/outputs/apk/release/app-release.apk "../release-android/Jarvis-${VERSION}-android.apk"
          ls -la ../release-android
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android
          if-no-files-found: error
          path: jarvis/release-android/*.apk

  release:
    name: 发布到 Releases
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          # 标签里带版本号：自动更新做差量下载时按版本号找到旧版本的 .blockmap
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: "贾维斯桌面版 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('1.0.{0}', github.run_number) }}"
          # 正式发布（不是预发布），“最新版本”才会指向它，自动更新才能找到
          prerelease: false
          make_latest: true
          files: dist/*
          body: |
            ## 下载哪个文件
            - **Windows**：`Jarvis-Setup-*.exe`（安装版，推荐）或 `Jarvis-*-win-x64.zip`（免安装，解压后运行 Jarvis.exe）
            - **Mac（M1/M2/M3/M4 芯片）**：`Jarvis-*-mac-arm64.dmg`
            - **Mac（Intel 芯片）**：`Jarvis-*-mac-x64.dmg`
            - **Linux**：`Jarvis-*-linux-x86_64.AppImage`
            - **安卓手机**：`Jarvis-*-android.apk`（用手机浏览器下载后点开安装；提示“未知来源”时允许安装）

            ## 电脑和手机同步
            设置 → 多设备同步：填好自己的阿里云 OSS，在电脑上点“生成同步码”，手机 App 里“用同步码设置”即可。数据上传前用同步密码加密。

            ## 自动更新
            装好之后不用再来这里下载：有新版本时贾维斯会提示。Windows 安装版 / Linux 在后台只下载改动的部分，点“重启以更新”即可；
            免安装版和 Mac 版会提示去下载页。

            ## 首次打开
            - 安装包没有购买代码签名证书：Windows 提示“已保护你的电脑”时点 **更多信息 → 仍要运行**；
              Mac 提示“无法验证开发者”时，在“访达 → 应用程序”里**右键 → 打开**，或在终端运行 `xattr -cr /Applications/Jarvis.app`。
            - 使用 MCP 本机工具需要电脑上装有 Node.js（npx）或 uv（uvx）。

            构建自 ${{ github.sha }}
