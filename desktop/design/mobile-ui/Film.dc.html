<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #16130f; color: #f2ece3;
           font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
           -webkit-font-smoothing: antialiased; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #16130f">

  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #2b241c">
    <div style="flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 9px; border: 1px solid #3a3128; background: #272119; font-size: 15px; font-weight: 600">
      <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">深巷第七夜</span>
      <span style="color: #7d7365; font-size: 11px">▾</span>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 9px; border: 1px solid #3a3128; background: #272119; display: flex; align-items: center; justify-content: center; color: #b6ab9b; font-size: 16px">⟳</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 14px 0">

    <!-- 成片 -->
    <div style="border-radius: 12px; overflow: hidden; background: #000; position: relative; height: 200px; margin-bottom: 12px">
      <div style="position: absolute; inset: 0; background: linear-gradient(155deg, #2c2620 0%, #16120d 55%, #000 100%)"></div>
      <div style="position: absolute; left: 50%; top: 50%; margin: -24px 0 0 -24px; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.5); border: 1px solid rgba(242,236,227,.35); color: #f2ece3; font-size: 16px; display: flex; align-items: center; justify-content: center">▶</div>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 9px; display: flex; align-items: center; gap: 8px">
        <span style="color: #f2ece3; font-size: 11.5px; font-variant-numeric: tabular-nums">00:00</span>
        <div style="flex: 1; height: 3px; border-radius: 2px; background: rgba(242,236,227,.25)"><div style="width: 0%; height: 3px; background: #e8b45f"></div></div>
        <span style="color: #b6ab9b; font-size: 11.5px; font-variant-numeric: tabular-nums">00:38</span>
      </div>
    </div>

    <!-- 体检：一个分数 + 最要紧的那一条，点进去逐条看 -->
    <div style="border: 1px solid #5a4a35; border-radius: 12px; background: #1e1a15; padding: 13px; margin-bottom: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #d9a441; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #f2ece3; font-variant-numeric: tabular-nums">76</div>
        <div style="flex: 1; min-width: 0">
          <b style="font-size: 15px; color: #d9a441">能发，但有几处值得改</b>
          <div style="color: #7d7365; font-size: 12px; line-height: 1.5; margin-top: 2px">3 处会被看出来 · 5 处质量风险</div>
        </div>
      </div>

      <div style="height: 1px; background: #2b241c; margin: 12px 0 4px"></div>

      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 0">
        <span style="flex: 0 0 auto; padding: 2px 7px; border-radius: 6px; background: rgba(217,97,76,.16); color: #d9614c; font-size: 11px">会被看出来</span>
        <span style="flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">第 3 镜首帧没吃上一镜末帧</span>
        <span style="color: #7d7365; font-size: 14px">›</span>
      </div>
      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 0; border-top: 1px solid #2b241c">
        <span style="flex: 0 0 auto; padding: 2px 7px; border-radius: 6px; background: rgba(217,97,76,.16); color: #d9614c; font-size: 11px">会被看出来</span>
        <span style="flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">第 7 镜还没有视频</span>
        <span style="color: #7d7365; font-size: 14px">›</span>
      </div>
      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 0; border-top: 1px solid #2b241c">
        <span style="flex: 0 0 auto; padding: 2px 7px; border-radius: 6px; background: rgba(217,164,65,.16); color: #d9a441; font-size: 11px">风险</span>
        <span style="flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">第 9 镜台词 4.6s，镜头只有 3.0s</span>
        <span style="color: #7d7365; font-size: 14px">›</span>
      </div>

      <div style="height: 40px; margin-top: 10px; border-radius: 10px; border: 1px solid #3a3128; background: #272119; color: #b6ab9b; font-size: 13.5px; display: flex; align-items: center; justify-content: center">看全部 8 条</div>
    </div>

    <!-- 素材 -->
    <div style="border: 1px solid #2b241c; border-radius: 12px; background: #1e1a15; padding: 13px">
      <b style="font-size: 13.5px; display: block; margin-bottom: 4px">拿走素材</b>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2b241c">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14.5px">成片 MP4</div>
          <div style="color: #7d7365; font-size: 11.5px">1080×1920 · 38s · 46 MB</div>
        </div>
        <div style="width: 62px; height: 40px; border-radius: 10px; border: 1px solid #3a3128; background: #272119; color: #f2ece3; font-size: 13.5px; display: flex; align-items: center; justify-content: center">存下</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14.5px">全部素材打包</div>
          <div style="color: #7d7365; font-size: 11.5px">分镜图、片段、配音、字幕 · 约 380 MB</div>
        </div>
        <div style="width: 62px; height: 40px; border-radius: 10px; border: 1px solid #3a3128; background: #272119; color: #f2ece3; font-size: 13.5px; display: flex; align-items: center; justify-content: center">下载</div>
      </div>
    </div>

  </div>

  <div style="flex: 0 0 auto; display: flex; border-top: 1px solid #2b241c; background: #16130f; padding-bottom: 8px">
    <div style="flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7d7365; font-size: 10.5px"><span style="font-size: 15px; line-height: 1">◍</span>流水线</div>
    <div style="flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7d7365; font-size: 10.5px"><span style="font-size: 15px; line-height: 1">✎</span>剧本</div>
    <div style="flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7d7365; font-size: 10.5px"><span style="font-size: 15px; line-height: 1">☰</span>设定</div>
    <div style="flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7d7365; font-size: 10.5px"><span style="font-size: 15px; line-height: 1">▤</span>分镜</div>
    <div style="flex: 1; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #e8b45f; font-size: 10.5px"><span style="font-size: 15px; line-height: 1">▶</span>成片</div>
  </div>

</div>
</x-dc>
</body>
</html>
