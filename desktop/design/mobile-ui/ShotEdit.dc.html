<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #16130f; color: #f2ece3;
           font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
           -webkit-font-smoothing: antialiased; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #16130f">

  <!-- 顶栏：全屏面板，不是卡片里展开的手风琴 -->
  <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid #2b241c">
    <div style="width: 60px; height: 40px; display: flex; align-items: center; color: #b6ab9b; font-size: 15px">取消</div>
    <div style="flex: 1; text-align: center">
      <div style="font-size: 15px; font-weight: 600; line-height: 1.2">第 3 镜</div>
      <div style="color: #7d7365; font-size: 11px; line-height: 1.4">第 1 场 · 客厅 · 夜</div>
    </div>
    <div style="width: 60px; height: 40px; border-radius: 10px; background: #e8b45f; color: #241b0c; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center">保存</div>
  </div>

  <!-- 分组：12 个字段拆成四组，一屏只答一类问题 -->
  <div style="flex: 0 0 auto; display: flex; gap: 4px; padding: 8px 14px 10px; border-bottom: 1px solid #2b241c">
    <div style="flex: 1; height: 36px; border-radius: 9px; background: #e8b45f; color: #241b0c; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center">内容</div>
    <div style="flex: 1; height: 36px; border-radius: 9px; background: #272119; border: 1px solid #3a3128; color: #b6ab9b; font-size: 13.5px; display: flex; align-items: center; justify-content: center">镜头</div>
    <div style="flex: 1; height: 36px; border-radius: 9px; background: #272119; border: 1px solid #3a3128; color: #b6ab9b; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 5px">预演台<span style="width: 5px; height: 5px; border-radius: 50%; background: #6fbf8a"></span></div>
    <div style="flex: 1; height: 36px; border-radius: 9px; background: #272119; border: 1px solid #3a3128; color: #b6ab9b; font-size: 13.5px; display: flex; align-items: center; justify-content: center">高级</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 14px 0">

    <!-- 画面 -->
    <div style="border: 1px solid #2b241c; border-radius: 12px; background: #1e1a15; padding: 13px; margin-bottom: 11px">
      <div style="display: flex; align-items: baseline; gap: 7px; margin-bottom: 8px">
        <b style="font-size: 13.5px">画面描述</b>
        <span style="color: #7d7365; font-size: 11.5px">出图和出视频的唯一输入</span>
      </div>
      <div style="min-height: 96px; border-radius: 10px; border: 1px solid #e8b45f; background: #272119; padding: 11px 12px; font-size: 16px; line-height: 1.6; color: #f2ece3">阿澈把门推开一条缝，走廊的冷光切在他半张脸上。<span style="display: inline-block; width: 1.5px; height: 17px; background: #e8b45f; vertical-align: -3px"></span></div>
      <div style="color: #7d7365; font-size: 11.5px; line-height: 1.5; margin-top: 7px">写偏一句，重出十次也回不到对的画面。</div>
    </div>

    <!-- 台词 -->
    <div style="border: 1px solid #2b241c; border-radius: 12px; background: #1e1a15; padding: 13px; margin-bottom: 11px">
      <b style="font-size: 13.5px; display: block; margin-bottom: 8px">台词</b>
      <div style="height: 46px; border-radius: 10px; border: 1px solid #3a3128; background: #272119; padding: 0 12px; font-size: 16px; display: flex; align-items: center">这门不该是开的。</div>

      <div style="display: flex; gap: 9px; margin-top: 10px">
        <div style="flex: 1; min-width: 0">
          <div style="color: #b6ab9b; font-size: 12px; margin-bottom: 6px">谁说的 <span style="color: #7d7365">· 用谁的声音</span></div>
          <div style="height: 46px; border-radius: 10px; border: 1px solid #3a3128; background: #272119; padding: 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between">阿澈<span style="color: #7d7365; font-size: 11px">▾</span></div>
        </div>
      </div>

      <div style="color: #b6ab9b; font-size: 12px; margin: 12px 0 6px">台词类型 <span style="color: #7d7365">· 嘴动不动</span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 7px">
        <div style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3128; background: #272119; color: #b6ab9b; font-size: 14px; display: flex; align-items: center">对白</div>
        <div style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #e8b45f; background: rgba(232,180,95,.14); color: #f2ece3; font-size: 14px; display: flex; align-items: center">心里话</div>
        <div style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3128; background: #272119; color: #b6ab9b; font-size: 14px; display: flex; align-items: center">旁白</div>
        <div style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3128; background: #272119; color: #b6ab9b; font-size: 14px; display: flex; align-items: center">画外音</div>
      </div>
      <div style="color: #7d7365; font-size: 11.5px; line-height: 1.5; margin-top: 8px">心里话＝他自己的声音，但嘴闭着。</div>

      <!-- 台词长度对时长的影响：本来是"生成完才发现说不完" -->
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 11px; padding: 9px 11px; border-radius: 10px; background: rgba(111,191,138,.12)">
        <span style="color: #6fbf8a; font-size: 13px">✓</span>
        <span style="flex: 1; color: #6fbf8a; font-size: 12px; line-height: 1.45">这句约 2.1 秒，本镜 3.2 秒 —— 说得完</span>
      </div>
    </div>

    <!-- 声音 -->
    <div style="border: 1px solid #2b241c; border-radius: 12px; background: #1e1a15; padding: 13px">
      <div style="display: flex; align-items: baseline; gap: 7px; margin-bottom: 8px">
        <b style="font-size: 13.5px">画外音效</b>
        <span style="color: #7d7365; font-size: 11.5px">听得见看不见的</span>
      </div>
      <div style="height: 46px; border-radius: 10px; border: 1px solid #3a3128; background: #272119; padding: 0 12px; font-size: 16px; color: #7d7365; display: flex; align-items: center">远处电梯到站的一声</div>
    </div>

  </div>

  <!-- 底栏：保存永远够得着，而且说清楚它不花钱 -->
  <div style="flex: 0 0 auto; padding: 10px 14px 20px; border-top: 1px solid #2b241c; background: #16130f">
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; height: 46px; border-radius: 10px; background: #e8b45f; color: #241b0c; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">保存</div>
      <div style="flex: 0 0 130px; height: 46px; border-radius: 10px; border: 1px solid #e8b45f; color: #e8b45f; font-size: 15px; display: flex; align-items: center; justify-content: center">保存并重出</div>
    </div>
    <div style="color: #7d7365; font-size: 11.5px; text-align: center; margin-top: 7px">保存不花钱；重出按镜数计费</div>
  </div>

</div>
</x-dc>
</body>
</html>
