<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>未来创梦 · 3D预演台真实组件演示</title>
  <link rel="stylesheet" href="./app.css">
  <style>
    body{margin:0;background:#0c0e13;color:#eef1f7}.demo-shell{max-width:1600px;margin:auto;padding:18px}
    .demo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.demo-head h1{font-size:20px;margin:0}.demo-head p{margin:4px 0 0;color:#9299aa;font-size:12px}.demo-badge{border:1px solid #276a58;border-radius:99px;padding:5px 9px;color:#72dbb5;background:#10251f;font-size:11px}
  </style>
  <script type="importmap">
  {"imports":{
    "three":"/three.js",
    "/three.js":"/three.js",
    "/three-gltf-loader.js":"/three-gltf-loader.js",
    "/three-orbit-controls.js":"/three-orbit-controls.js",
    "/three-transform-controls.js":"/three-transform-controls.js",
    "/three-skeleton-utils.js":"/three-skeleton-utils.js",
    "/previz.js":"/previz.js"
  }}</script>
</head>
<body><main class="demo-shell"><header class="demo-head"><div><h1>3D导演预演台</h1><p>仓库真实组件演示 · 拖拽排位、对象属性、灯光、机位与分轨关键帧</p></div><span class="demo-badge">真实组件 / 演示数据</span></header><div id="demo"></div><pre id="demo-error" hidden style="white-space:pre-wrap;color:#ff9b9b;background:#2a1115;border:1px solid #71313a;padding:12px;border-radius:8px"></pre></main><script>
  const showDemoError = (value) => {
    const node = document.querySelector('#demo-error');
    node.hidden = false;
    node.textContent = `预演组件初始化失败：${value?.stack || value?.message || value}`;
  };
  window.addEventListener('error', (event) => showDemoError(event.error || `${event.message} (${event.filename}:${event.lineno})`));
  window.addEventListener('unhandledrejection', (event) => showDemoError(event.reason));
</script><script type="module" src="./previz-demo.js"></script></body>
</html>
