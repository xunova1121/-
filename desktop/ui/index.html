<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>未来创梦 · AI 短剧工作台</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-slate" aria-hidden="true"></div>
          <div>
            <div class="brand-name">未来创梦</div>
            <div class="brand-sub eyebrow">FUTUREDREAM STUDIO</div>
          </div>
        </div>

        <nav class="nav" id="nav" aria-label="主导航"></nav>

        <div class="sidebar-foot">
          <div class="stat-row"><span>数据目录</span><code id="foot-datadir" title="">—</code></div>
          <div class="stat-row"><span>凭据加密</span><code id="foot-vault">—</code></div>
          <div class="stat-row"><span>FFMPEG</span><code id="foot-ffmpeg">—</code></div>
          <div class="stat-row" style="margin-top:4px">
            <span>外观</span>
            <button class="btn ghost sm" id="btn-theme" style="padding:2px 8px;font-size:10.5px">切换</button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1 id="view-title">创作台</h1>
          <div class="topbar-right">
            <div class="chain" id="chain" title="当前能力路由：每种能力用哪家哪个模型"></div>
            <button class="btn ghost sm" id="btn-refresh">刷新</button>
          </div>
        </header>
        <div class="route-banner" id="route-banner" style="display:none"></div>
        <section class="view" id="view"><div class="view-inner" id="view-inner"></div></section>
      </main>
    </div>

    <!-- 右下角常驻的运行状态。钉在这里而不是页面中部：
         跑起来之后你多半正往下翻着改分镜，中部的日志框那时已经看不见了。 -->
    <div class="job-hud" id="job-hud" hidden></div>

    <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
    <script type="importmap">{"imports":{"three":"/three.js"}}</script>
    <script>
      // 发布包里无论是模块加载、异步拒绝还是本地服务卡住，都不能只留下空壳。
      // 这段刻意不依赖 app.js：app.js 本身无法加载时它仍然能工作。
      (function () {
        function showBootFailure(reason) {
          var host = document.getElementById('view-inner');
          if (!host || host.dataset.bootError || host.children.length) return;
          host.dataset.bootError = '1';
          var msg = String(reason && (reason.message || reason) || '脚本没有加载').replace(/[<>&]/g, '');
          host.innerHTML = '<div class="empty"><b>界面启动失败</b><div style="margin-top:8px">' + msg +
            '</div><div style="margin-top:10px;font-size:12px">请打开开发者工具的 Console，复制第一条红色错误；这能定位到具体文件和行号。</div></div>';
        }
        window.addEventListener('error', function (event) { showBootFailure(event.error || event.message); }, true);
        window.addEventListener('unhandledrejection', function (event) { showBootFailure(event.reason); });
        window.setTimeout(function () {
          var nav = document.getElementById('nav');
          var host = document.getElementById('view-inner');
          if (nav && host && !nav.children.length && !host.children.length) {
            showBootFailure('界面初始化超过 12 秒没有完成。请检查 Console 的第一条红色错误。');
          }
        }, 12000);
      }());
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
